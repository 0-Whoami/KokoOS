<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <style>
    svg {
      fill: #fff;
    }
    .skin {
      fill: #efd1ff;
    }
    .deep {
      fill: #000840;
    }
    .shade {
      fill: currentColor;
      opacity: 0.2;
    }
    .squish {
      transform-box: fill-box;
      transform-origin: 50% 66.67%;
      animation: squish 4s ease-in-out infinite;
    }

    @keyframes squish {
      0% {
        transform: scaleY(1);
      }
      1% {
        transform: scaleY(0.1);
      }
      2%,
      100% {
        transform: scaleY(1);
      }
    }
  </style>

  <path
    d="m7 5v1h-2v1h-1v1h-2v4h1v1h1v1h8v-1h1v-1h1v-4h-2v-1h-1v-1h-2.0859v-1z"
  />
  <g id="ear">
    <path d="m3 2v1h-1v4h1v-1h1v-1h2v-1h-1v-1h-1v-1z" />
    <g class="skin">
      <path opacity=".8" d="M3 5h1v1H3z" />
      <path opacity=".64" d="M4 4h1v1H4z" />
      <path opacity=".41" d="M3 4h1v1H3z" />
    </g>
  </g>
  <use href="#ear" transform="matrix(-1 0 0 1 16 0)" />

  <g class="deep">
    <path class="squish" d="M6 8h1v2H6zm4 0h1v2h-1z" />
    <path opacity=".64" d="M9 10h1v1H9z" />
    <path opacity=".08" d="M7 11v1h1v1h3v-1h1v-1z" />
    <path opacity=".08" d="M8 11h3v1H8z" />
  </g>
  <path id="tounge" class="skin" d="M9 12h1v1H9z" />

  <g class="shade">
    <path d="M6 8h1v1H6zm4 0h1v1h-1z" />
    <path
      d="M2 11v1h1v-1zM3 12v1h1v-1zM4 13v1h2v-1H5zM13 11v1h1v-1zM13 12H12v1h1zM12 13H11v1h1zM2 8h1v1H2zM13 6h1v1h-1zM10 4h1v1h-1zM2 3h1v1H2zM2 5h1v2H2z"
    />
    <!-- <path opacity="1" d="M2 6h1v1H2zM4 13h1v1H4z" /> -->
    <path opacity=".1" d="m9 10v1h-2v1h1v1h1v-1h1v1h1v-1h1v-1h-2v-1z" />
